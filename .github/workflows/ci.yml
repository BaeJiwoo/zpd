name: ZPD CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  socket:
    name: Socket and client networking
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Build socket server and mock client
        run: |
          $env:VCPKG_ROOT = $env:VCPKG_INSTALLATION_ROOT
          ./tools/Build.ps1 -Target Socket -Generator 'Visual Studio 17 2022'
      - name: Verify generated protocol
        run: ./tools/Test.ps1 -Target Contracts
      - name: Run native integration tests
        run: ./tools/Test.ps1 -Target Socket
      - name: Test C# client against the socket server
        run: ./tools/Test.ps1 -Target Networking

  api:
    name: API and HTTP contract
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: ./tools/Build.ps1 -Target Api
      - run: ./tools/Test.ps1 -Target Api

  required:
    name: CI
    if: always()
    needs: [socket, api]
    runs-on: ubuntu-latest
    steps:
      - name: Check all required results
        env:
          SOCKET_RESULT: ${{ needs.socket.result }}
          API_RESULT: ${{ needs.api.result }}
        run: |
          if ($env:SOCKET_RESULT -ne 'success' -or $env:API_RESULT -ne 'success') {
            throw 'One or more required checks failed or were cancelled.'
          }
